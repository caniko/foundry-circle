[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
with_nextest = true
with_msrv = true
with_audit = true
with_deny = true
with_docs = true
publish_crates = true
provider = "actions"
platform = "github"
push_branches = ["trunk"]
publish_strategy = "members"

[release.signing]
key = "818D507F1E62139F8A17EAA64623DEA06FDACFE1"

[release.github]
repo = "caniko/foundry-circle"
target_branch = "trunk"

# Versioned harbor-rs bundle assets (including the cargo-binstall archive)
# replace the former hand-made unversioned `release/foundry-circle.tar.gz`.
# `platforms` names the bundle matrix: the x86_64-linux job ships the portable
# Linux archives and cross-builds the Windows zip, and macos-15 builds the
# aarch64-darwin archive natively.
[release.artifacts]
runner = "ubuntu-24.04"
platforms = ["linux", "macos", "windows"]
sign = false
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]

# Linux closures consumed by canix, published to the public canix cache on
# trunk pushes only (secret ATTIC_TOKEN). Pull requests build but never push.
[prebuild]
push_branches = ["trunk"]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [
  ".#packages.x86_64-linux.foundry-circle",
  ".#packages.x86_64-linux.foundryvtt-fetch",
]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "foundry-circle"
token_secret = "ATTIC_TOKEN"
