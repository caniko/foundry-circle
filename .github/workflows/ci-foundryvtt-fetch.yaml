# Generated by simit. Manual edits will be reported as ci=drift.
name: "CI (foundryvtt-fetch)"

on:
  push:
    branches:
      - "trunk"
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type == 'tag' && github.ref || format('refs/heads/{0}', github.event.pull_request.head.ref || github.ref_name) }}
  cancel-in-progress: true

jobs:
  test:
    name: "foundryvtt-fetch / test"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check nextest tool
        run: nix develop -c cargo-nextest --version

      - name: Test all features
        run: nix develop -c cargo nextest run -p foundryvtt-fetch --all-features

      - name: Doctests
        run: nix develop -c cargo test --doc -p foundryvtt-fetch --all-features

      - name: Check MSRV
        run: |
          set -eu
          test "$(nix develop .#msrv -c rustc --version | cut -d ' ' -f 2)" = '1.93.0'
          nix develop .#msrv -c cargo check -p foundryvtt-fetch --all-targets --all-features

      - name: Build docs
        run: nix develop .#docs -c cargo doc -p foundryvtt-fetch --no-deps --all-features

      - name: Clippy all features
        run: nix develop -c cargo clippy -p foundryvtt-fetch --all-targets --all-features -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p foundryvtt-fetch --allow-dirty --list

  changes:
    name: "foundryvtt-fetch / changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Root Markdown nobody builds is documentation.
          classify() {
            case "$1" in
              */*) return 1 ;;
              README.md) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          code=true
          base=
          # A branch push compares with its fork point, not its previous push, which
          # may never have passed. Default-branch pushes qualify and publish every
          # revision, so they always run.
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              "refs/heads/$DEFAULT_BRANCH") ;;
              refs/heads/*) base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null) || base= ;;
            esac
          fi
          # A missing or unreachable base, or an empty diff, has nothing to classify.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && changed=$(git diff --name-only "$base" HEAD --) && [ -n "$changed" ]; then
            code=false
            while IFS= read -r path; do
              classify "$path" || { code=true; break; }
            done <<< "$changed"
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
