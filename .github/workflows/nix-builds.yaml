# Generated by simit. Manual edits will be reported as ci=drift.
name: Nix installable builds

on:
  push:
    branches:
      - "trunk"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.installable }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - installable: ".#packages.x86_64-linux.release-bundle"
            system: "x86_64-linux"
            runner: "ubuntu-24.04"
          - installable: ".#packages.aarch64-darwin.release-bundle"
            system: "aarch64-darwin"
            runner: "macos-15"
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Verify native Nix runner
        env:
          EXPECTED_NIX_SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "$machine" in
            arm64) machine=aarch64 ;;
            amd64) machine=x86_64 ;;
            i386|i486|i586) machine=i686 ;;
            ppc) machine=powerpc ;;
            ppcle) machine=powerpcle ;;
            ppc64) machine=powerpc64 ;;
            ppc64le) machine=powerpc64le ;;
          esac
          kernel="$(uname -s)"
          case "$kernel" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            FreeBSD) os=freebsd ;;
            *) echo "Unsupported native Nix runner kernel: $kernel" >&2; exit 1 ;;
          esac
          actual_system="$machine-$os"
          if [ "$actual_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got hardware $actual_system" >&2
            exit 1
          fi
          nix_system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          if [ "$nix_system" != "$EXPECTED_NIX_SYSTEM" ]; then
            echo "Native Nix runner mismatch: expected $EXPECTED_NIX_SYSTEM, got configured Nix system $nix_system" >&2
            exit 1
          fi
          printf 'Verified native hardware %s and Nix system %s\n' "$actual_system" "$nix_system"
      - name: Build ${{ matrix.installable }}
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: nix build --no-link --no-update-lock-file "$INSTALLABLE"

  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Root Markdown nobody builds is documentation.
          classify() {
            case "$1" in
              */*) return 1 ;;
              README.md) return 1 ;;
              *.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          code=true
          base=
          # A branch push compares with its fork point, not its previous push, which
          # may never have passed. Default-branch pushes qualify and publish every
          # revision, so they always run.
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              "refs/heads/$DEFAULT_BRANCH") ;;
              refs/heads/*) base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null) || base= ;;
            esac
          fi
          # A missing or unreachable base, or an empty diff, has nothing to classify.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && changed=$(git diff --name-only "$base" HEAD --) && [ -n "$changed" ]; then
            code=false
            while IFS= read -r path; do
              classify "$path" || { code=true; break; }
            done <<< "$changed"
          fi
          printf 'code=%s\n' "$code" >> "$GITHUB_OUTPUT"
