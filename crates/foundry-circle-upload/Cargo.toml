[package]
name = "foundry-circle-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native client for the Foundry Circle asset upload API"
readme = "README.md"
repository = "https://github.com/caniko/foundry-circle"
keywords = ["foundryvtt", "assets", "upload", "cli"]
categories = ["command-line-utilities", "api-bindings"]
publish = false

[lib]
name = "foundry_circle_upload"
path = "src/lib.rs"

[[bin]]
name = "foundry-circle-upload"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
media-oxide.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

# Generated by the release bundle; keep in sync with
# `nix eval .#checks.x86_64-linux.binstall-metadata-foundry-circle-upload.toml`.
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-aarch64-darwin.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-linux-nix-bundle.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-linux-nix-bundle.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
