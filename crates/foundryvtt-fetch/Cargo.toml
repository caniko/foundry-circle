[package]
name = "foundryvtt-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Credential-safe Foundry VTT release acquisition and archive validation"
readme = "README.md"
repository = "https://github.com/caniko/foundry-circle"
keywords = ["foundryvtt", "nix", "provenance"]
categories = ["command-line-utilities", "filesystem"]
publish = true

[lib]
name = "foundryvtt_fetch"
path = "src/lib.rs"

[[bin]]
name = "foundryvtt-fetch"
path = "src/main.rs"

[[bin]]
name = "foundryvtt-fetchd"
path = "src/daemon.rs"

[[bin]]
name = "foundryvtt-fetch-hook"
path = "src/hook.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
fs2.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
zeroize.workspace = true
zip.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

# Generated by the release bundle; keep in sync with
# `nix eval .#checks.x86_64-linux.binstall-metadata.toml`.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-linux-nix-bundle.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/foundry-circle-{ version }-x86_64-linux-nix-bundle.tar.gz"
pkg-fmt = "tgz"
bin-dir = "bin/{ bin }{ binary-ext }"
