[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
with_nextest = true
with_msrv = true
with_audit = true
with_deny = true
with_docs = true
publish_crates = true
provider = "actions"
platform = "github"

[release.signing]
key = "818D507F1E62139F8A17EAA64623DEA06FDACFE1"

[release.codeberg]
repo = "caniko/foundry-circle"

[release.artifacts]
runner = "atlas"
build_commands = [
  "mkdir -p release",
  "nix build .#release-bundle --out-link release/foundry-circle.tar.gz",
]
sign = false

# Linux closures consumed by canix, published to the public canix cache on
# trunk pushes only (secret ATTIC_TOKEN). Pull requests build but never push.
[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [
  ".#packages.x86_64-linux.foundry-circle",
  ".#packages.x86_64-linux.foundryvtt-fetch",
]
push_branches = ["trunk"]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "foundry-circle"
token_secret = "ATTIC_TOKEN"
