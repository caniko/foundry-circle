[workspace]
resolver = "2"
members = [
  "crates/foundry-circle",
  "crates/foundry-circle-upload",
  "crates/foundryvtt-fetch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[workspace.dependencies]
dioxus = { version = "=0.7.9", default-features = false, features = [
  "asset",
  "fullstack",
  "html",
  "launch",
  "macro",
  "router",
] }
dioxus-router = "=0.7.9"
tartan-ui-core = { git = "https://github.com/caniko/tartan-ui.git", rev = "d8f994da26846b6785194e7969a5d31d9fc050f1" }
tartan-ui-dioxus = { git = "https://github.com/caniko/tartan-ui.git", rev = "d8f994da26846b6785194e7969a5d31d9fc050f1", default-features = false }
theme-broker = { git = "https://github.com/caniko/nix-theme-broker.git", rev = "483595220b0c5c07fe2010ec596020d0b73d13a1" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "fs",
  "limit",
  "set-header",
  "trace",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
# Keep the integration reproducible before the first crates.io publication.
oidc-app-auth = { version = "0.1.0", git = "https://github.com/caniko/oidc-app-auth.git", rev = "cc83fde58f45872c65271bf71024dd028610d89d" }
# The DM's local converter (upload client) and this server share one asset
# contract: kinds, allowed names, and magic sniffing. The server re-validates.
media-oxide = { git = "https://github.com/caniko/media-oxide.git", rev = "250ff2c6641d8847d244a9a0565bf9a9c991b5dd", default-features = false, features = [
  "foundry",
] }
getrandom = "0.3"

# The downloader is deliberately independent of the Dioxus application so it
# can be published and used by Nix/systemd without shipping the operator UI.
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
chromiumoxide = { version = "0.9", default-features = false }
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
  "cookies",
  "json",
  "rustls-tls",
  "stream",
] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
zeroize = "1"
zip = { version = "9", default-features = false, features = [
  "deflate",
  "bzip2",
  "xz",
  "zstd",
] }
