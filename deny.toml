[advisories]
version = 2

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LicenseRef-UFL-1.0",
  "MIT",
  "OFL-1.1",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# media-oxide owns the Foundry asset conversion policy and is AGPL-3.0-only.
# Scoped to that crate instead of widening the global allow list.
[[licenses.exceptions]]
crate = "media-oxide"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/caniko/media-oxide.git",
  "https://github.com/caniko/tartan-ui.git",
  "https://github.com/caniko/nix-theme-broker.git",
  "https://github.com/caniko/oidc-app-auth.git",
]
