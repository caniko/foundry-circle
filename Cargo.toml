[workspace]
resolver = "2"
members = ["crates/foundry-circle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Can H. Tartanoglu <canhtart@gmail.com>"]

[workspace.dependencies]
dioxus = { version = "=0.7.9", default-features = false, features = [
  "asset",
  "fullstack",
  "html",
  "launch",
  "macro",
  "router",
] }
dioxus-router = "=0.7.9"
tartan-ui-core = { git = "https://codeberg.org/caniko/tartan-ui.git", rev = "a52223edf2f3119797d82d44b51b938b85f06639" }
tartan-ui-dioxus = { git = "https://codeberg.org/caniko/tartan-ui.git", rev = "a52223edf2f3119797d82d44b51b938b85f06639", default-features = false }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "fs",
  "limit",
  "set-header",
  "trace",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
